{% extends "base.html" %}

{% block title %}充值 - 狂野飙车9账号交易平台{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <h1 class="section-title">💎 充值金币</h1>
    
    <div class="card" style="margin-bottom: 1.5rem;">
        <div style="text-align: center; padding: 1rem; background: rgba(255, 255, 255, 0.05); border-radius: 10px;">
            <p style="color: #888; margin-bottom: 0.5rem;">当前余额</p>
            <p style="font-size: 2rem; font-weight: bold; color: #e94560;">💰 {{ user.balance }} 金币</p>
        </div>
    </div>
    
    <div class="card">
        <h3 style="margin-bottom: 1.5rem;">选择充值金额</h3>
        
        <form method="POST">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem;">
                <label style="cursor: pointer;">
                    <input type="radio" name="amount" value="100" style="display: none;" required>
                    <div class="card" style="text-align: center; cursor: pointer; transition: all 0.3s;" onclick="selectAmount(100, this)">
                        <div style="font-size: 1.5rem;">💰</div>
                        <div style="font-weight: bold;">100</div>
                        <div style="font-size: 0.85rem; color: #888;">金币</div>
                    </div>
                </label>
                
                <label style="cursor: pointer;">
                    <input type="radio" name="amount" value="500" style="display: none;">
                    <div class="card" style="text-align: center; cursor: pointer; transition: all 0.3s;" onclick="selectAmount(500, this)">
                        <div style="font-size: 1.5rem;">💎</div>
                        <div style="font-weight: bold;">500</div>
                        <div style="font-size: 0.85rem; color: #888;">金币</div>
                    </div>
                </label>
                
                <label style="cursor: pointer;">
                    <input type="radio" name="amount" value="1000" style="display: none;">
                    <div class="card" style="text-align: center; cursor: pointer; transition: all 0.3s;" onclick="selectAmount(1000, this)">
                        <div style="font-size: 1.5rem;">👑</div>
                        <div style="font-weight: bold;">1000</div>
                        <div style="font-size: 0.85rem; color: #888;">金币</div>
                    </div>
                </label>
                
                <label style="cursor: pointer;">
                    <input type="radio" name="amount" value="2000" style="display: none;">
                    <div class="card" style="text-align: center; cursor: pointer; transition: all 0.3s;" onclick="selectAmount(2000, this)">
                        <div style="font-size: 1.5rem;">💰</div>
                        <div style="font-weight: bold;">2000</div>
                        <div style="font-size: 0.85rem; color: #888;">金币</div>
                    </div>
                </label>
                
                <label style="cursor: pointer;">
                    <input type="radio" name="amount" value="5000" style="display: none;">
                    <div class="card" style="text-align: center; cursor: pointer; transition: all 0.3s;" onclick="selectAmount(5000, this)">
                        <div style="font-size: 1.5rem;">💎</div>
                        <div style="font-weight: bold;">5000</div>
                        <div style="font-size: 0.85rem; color: #888;">金币</div>
                    </div>
                </label>
                
                <label style="cursor: pointer;">
                    <input type="radio" name="amount" value="10000" style="display: none;">
                    <div class="card" style="text-align: center; cursor: pointer; transition: all 0.3s;" onclick="selectAmount(10000, this)">
                        <div style="font-size: 1.5rem;">👑</div>
                        <div style="font-weight: bold;">10000</div>
                        <div style="font-size: 0.85rem; color: #888;">金币</div>
                    </div>
                </label>
            </div>
            
            <div class="form-group">
                <label for="amount-custom">自定义金额</label>
                <input type="number" id="amount-custom" name="amount" min="1" placeholder="输入任意金额">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                💎 立即充值（虚拟）
            </button>
        </form>
        
        <div style="margin-top: 1.5rem; padding: 1rem; background: rgba(255, 193, 7, 0.1); border-radius: 8px; text-align: center;">
            <p style="color: #ffc107; font-size: 0.9rem;">
                ⚠️ 这是一个虚拟充值系统，不会扣除任何真实费用
            </p>
        </div>
    </div>
</div>

<script>
function selectAmount(amount, element) {
    // 取消所有选中状态
    document.querySelectorAll('.card').forEach(card => {
        card.style.border = '';
        card.style.background = '';
    });
    
    // 设置选中状态
    element.style.border = '2px solid #e94560';
    element.style.background = 'rgba(233, 69, 96, 0.2)';
    
    // 取消自定义输入
    document.getElementById('amount-custom').value = '';
}
</script>
{% endblock %}
